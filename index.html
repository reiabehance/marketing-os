<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réia · Marketing OS</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;
 --wine:#7B0017;--wine2:#9c2236;--ink:#15150E;--ivory:#FFFAF1;--paper:#fffdf9;--card:#ffffff;
 --line:#e6dccb;--soft:#f4ede1;--muted:#6a6051;--muted2:#8a7f6c;
 --good:#2e7d52;--goodbg:#e9f4ee;--warn:#b6862c;--warnbg:#fbf2dc;--bad:#b23b3b;--badbg:#f8e7e7;--info:#4a5a86;--infobg:#eef1f8;
 --sh:0 1px 2px rgba(21,21,14,.04),0 10px 30px rgba(21,21,14,.05);--rad:16px;}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;letter-spacing:.2px}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* SIDEBAR */
.side{background:var(--ink);color:#efe7d8;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px}
.brand{font-family:'Cormorant Garamond',serif;font-size:26px;color:#fff;letter-spacing:1px;padding:2px 10px}
.brand b{color:#e8a9b3}
.brandsub{font-size:10px;color:#9a9082;padding:0 10px 18px;text-transform:uppercase;letter-spacing:2.5px}
.navgroup{font-size:10px;color:#8f8676;text-transform:uppercase;letter-spacing:1.6px;padding:14px 12px 5px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:#cfc6b6;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit;transition:.12s}
.nav button:hover{background:#241f12;color:#fff}
.nav button.on{background:var(--wine);color:#fff;font-weight:500}
.nav .ic{width:17px;text-align:center;opacity:.92;font-size:13px}
.sideft{font-size:10px;color:#7d7565;padding:16px 10px 4px;border-top:1px solid #2a2517;margin-top:14px}
/* MAIN */
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:6;background:rgba(255,250,241,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:15px 30px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:24px;color:var(--wine);line-height:1}
.topbar .sub{font-size:12px;color:var(--muted)}
.mobnav{display:none}
.livechip{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;box-shadow:0 0 0 3px rgba(46,125,82,.16)}
.wrap{padding:26px 30px 70px;max-width:1240px}
.sec{display:none}.sec.on{display:block;animation:f .3s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{color:var(--muted);font-size:13.5px;margin:-4px 0 22px;max-width:820px}
h2.t{font-size:26px;margin-bottom:2px}
.sh{font-size:18px;color:var(--ink);margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
.sh small{font-family:'Poppins';font-size:11px;color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:1px}
/* GRID + CARD */
.grid{display:grid;gap:16px}
.auto{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;box-shadow:var(--sh)}
.card.flush{padding:0;overflow:hidden}
.card.tint{background:linear-gradient(180deg,#fff, #fffaf0)}
.lab{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:500}
.kpi .val{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;line-height:1.05;margin-top:4px;color:var(--ink)}
.kpi .d{font-size:11.5px;margin-top:4px}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:999px;line-height:1.3}
.c-good{background:var(--goodbg);color:var(--good)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-bad{background:var(--badbg);color:var(--bad)}.c-info{background:var(--infobg);color:var(--info)}.c-soft{background:var(--soft);color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--wine),var(--wine2));transition:width .4s}
.chartbox{position:relative;height:250px}.chartbox.sm{height:190px}
.ring{--p:0;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--wine) calc(var(--p)*1%),var(--soft) 0);flex:0 0 auto}
.ring>span{width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:17px}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--paper)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
/* FORMS */
input,select,textarea{font-family:inherit;font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(123,0,23,.22);border-color:var(--wine)}
.btn{background:var(--wine);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--wine2)}.btn.ghost{background:#fff;color:var(--wine);border:1px solid var(--wine)}.btn.sm{padding:6px 12px;font-size:12px}
.btn.tiny{padding:4px 10px;font-size:11.5px;border-radius:8px}
.icobtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;padding:3px 7px;border-radius:6px;transition:.12s}.icobtn:hover{background:var(--badbg);color:var(--bad)}
.icobtn.del{color:#bb4a5c}.icobtn.del:hover{background:var(--badbg);color:var(--bad)}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.note{font-size:11.5px;color:var(--muted)}
.editable{background:#fffdf4}
.kv{display:flex;flex-direction:column;gap:3px;margin:2px 0}
.kv label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.list-row{padding:9px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border:0}
/* CAMPAIGN CARDS */
.ccamp{cursor:pointer;transition:.15s;position:relative}
.camp:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(21,21,14,.09)}
.cback{background:none;border:0;color:var(--wine);cursor:pointer;font-size:13px;font-weight:500;padding:0;margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}

 .topbar{padding:12px 16px}.wrap{padding:18px 16px 70px}
 .g2,.g3,.g4{grid-template-columns:1fr}
}
.raw{background:#16160f;color:#cfe3bd;font-size:10.5px;padding:11px;border-radius:10px;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin-top:10px;font-family:ui-monospace,Menlo,monospace}.raw:empty{display:none}
code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:11px;font-family:ui-monospace,monospace}
/* readability lift */
.lead{font-size:14.5px;color:#48412f;line-height:1.6}
.note{font-size:12.5px}
.lab{font-size:11px;color:var(--muted);font-weight:600}
input,select,textarea{font-size:13.5px;padding:9px 11px;color:var(--ink)}
.card{padding:20px 22px}
.kpi .val{font-size:36px}
.list-row{padding:11px 0}
th{font-size:10.5px;color:var(--muted)}
td{padding:11px 12px;font-size:13px}
.chip{font-size:11px}
/* investor lens */
.invlens{background:linear-gradient(90deg,rgba(123,0,23,.055),rgba(123,0,23,0));border-left:3px solid var(--wine);border-radius:0 12px 12px 0;padding:12px 18px;margin:0 0 20px;font-size:13.5px;color:#48412f;line-height:1.55}
.invtag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:var(--wine);padding:3px 9px;border-radius:6px;margin-right:9px;vertical-align:middle}
/* simple, readable, editable tables */
tr:nth-child(even) td{background:#faf6ee}
.tw td{padding:9px 11px}
.tw td input,.tw td select{background:#fffdf7;border:1px solid #efe7d8;border-radius:7px;padding:8px 9px;font-size:13px}
.tw td input:hover,.tw td select:hover{border-color:#d9cdb8;background:#fff}
.tw td input:focus,.tw td select:focus{background:#fff;border-color:var(--wine);outline:2px solid rgba(123,0,23,.18)}
th{background:#f7f0e4}
/* ===== v2 calm polish ===== */
.wrap{padding:30px 36px 92px}
.auto{grid-template-columns:repeat(auto-fit,minmax(236px,1fr))}
.grid{gap:18px}
.sh{font-size:19px;margin:38px 0 14px;letter-spacing:.3px}
.lead{margin:-2px 0 26px}
.card{border-color:#efe7d6;box-shadow:0 1px 2px rgba(21,21,14,.03),0 10px 26px rgba(21,21,14,.045)}
.kpi .lab{white-space:normal;line-height:1.35}
.kpi .val{font-size:33px;margin-top:6px}
.collap{border:1px solid #efe7d6;border-radius:16px;background:var(--card);margin:16px 0;box-shadow:0 1px 2px rgba(21,21,14,.03),0 10px 26px rgba(21,21,14,.045);overflow:hidden}
.collap>summary{list-style:none;cursor:pointer;padding:17px 22px;font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;color:var(--ink);display:flex;align-items:center;gap:10px;user-select:none}
.collap>summary::-webkit-details-marker{display:none}
.collap>summary small{font-family:'Poppins';font-size:11px;color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:1px}
.collap>summary::after{content:'\25be';margin-left:auto;color:var(--muted2);font-size:13px;transition:transform .2s}
.collap[open]>summary::after{transform:rotate(180deg)}
.collap>summary:hover{background:#faf6ee}
.collap .cbody{padding:2px 22px 22px}
.collap .cbody>.acts:first-child,.collap .cbody>.sh:first-child{margin-top:8px}
@media(max-width:860px){.wrap{padding:18px 14px 80px}.auto{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.sh{margin:26px 0 12px}}
/* ===== completion celebration ===== */
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.celebrate span{position:absolute;top:46%;animation:cfall 1.3s ease-out forwards;opacity:0;will-change:transform,opacity}
@keyframes cfall{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-180px) scale(1.15) rotate(50deg);opacity:0}}
.celebrate-toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:500;letter-spacing:.2px;box-shadow:var(--sh);animation:ctoast 1.6s ease forwards}
@keyframes ctoast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
/* ===== UI v3 — clean, readable, no reading breaks ===== */

/* ===== nav + save chrome ===== */

 scriptLib:[{"title": "Organic Post - July 2nd", "text": "Organic Post - July 2nd\nHave you ever had a dream so big, everyone told you not to try?\n1,278 days ago, my friends and I did.\nThree of us, fresh out of college —\nand like most people, all we had was a dream, an idea, and an empty bank account.\nAnd the dream? To start a diamond jewellery brand of our own.\nWhich sounded mad - because for a hundred years, the mined diamond industry has told every generation the same thing:\n\"Come back when you're settled.\" Settled, meaning rich.\nRewriting that rule felt necessary.\nSo we quit our jobs, skipped our master's, pitched to over a hundred investors,\nand walked into a 1000 jewellery stores to learn about a market that had no reason to teach us.\nAnd on July 2nd, 2023 — our dream got an address. Jayanagar, 4th Block.\nWhat's happened since then is bigger than us.\nA whole generation is now designing their own rings, proposing on their own terms, wearing diamonds in their twenties instead of waiting for their fifties.\nThey shouldn't have to choose between the ring they dream of and the ring they can afford. They deserve to bring their dreams to life.\nThis July, Réia turns three. Five stores, three cities, 2843 proposals\n— and it all started at 4th Block, Jayanagar.\nTo everyone who walked in before we'd earned it: this one's yours.\nLook up before you give up - Hero Video Concept\nInstead of random events and random people - we can have one person go through three events through his day.\nWhat do you do when you know you're screwed? — Give up and"}, {"title": "Pain Point A - Carat Club", "text": "Pain Point A - Carat Club\nIf you're getting married soon, there's something you should know first\nAudience and Angle: A woman 6–8 months from her wedding, just beginning her jewellery purchases. The leak: on a ₹20–30L bridal budget, ₹4–5L silently goes to making & wastage charges - money that buys labour, not jewellery she keeps.\nFounder Led I: Before you buy bridal Jewellery\nIf you're getting married in the next few months, give me thirty seconds and you might just save five lakhs.\nYour jewellery budget might be anywhere between 20-30L. What nobody tells you is that four, five lakh of that never becomes jewellery - it goes to making and wastage charges.\nSo even if you bought your jewellery today and went back to the same store tomorrow, you've lost 20% of what you spent, overnight.\nWhat if you could skip on MC + Wastage completely? Sign up for Réia's Carat Club program and get 100% off on Making Charges and Wastages for a year.\nI hope you're seeing this before your wedding, cause every time we run into brides who tell us \"I wish I had known this sooner\"\nClosing CTA VO\nFounder Led II: Before you buy bridal Jewellery - Skit Based\nMy best friend got married and here's how I helped her save 6L on her jewellery — Person 1\nWhat? No way. — Person 2\nYour jewellery budget might be anywhere between 20-30L. What nobody tells you is that four, five lakh of that never becomes jewellery - it goes to making and wastage charges. — Person 1\nSo even if you bought your jewellery today and went"}, {"title": "Why are diamonds expensive?", "text": "Why are diamonds expensive?\nWhy are diamonds so expensive? Ask anyone. You'll get the same answer. They're rare. Hard to find. Scarce.\nThat's what we've all been told. That's not why.\nGo back to the 1800s. Diamonds were actually abundantly available and it wasn’t perceived as “Rare”.\nThey were just stones, and not particularly sought after.\nThen one company did something no one had done before — every time a new mine was discovered, anywhere on earth, they bought it.\nDecade after decade. Until they controlled where almost every diamond came from.\nWhen demand dropped and prices should have fallen — they bought diamonds off the market.\nJust to keep them scarce.\nThen they wrote one line. In 1947. A diamond is forever. Tied it to love. To status. To how much someone means to you.\nThe bigger the diamond, the bigger the love.\nIn 2022, Netflix Documentary \"Nothing lasts forever\" stated that it is estimated that even if a diamond was given to every man, woman and child on the planet, we'd still have more diamond left.\nThat's not rare. That's controlled supply.\nSo you know what to say when next time someone asks you\n35k per carat\nYou always know the price of gold. Why don't you know the price of your diamond?\nThe indsutry follows a slab rate system for pricing diamonds. The bigger the diamond, the higher the slab rate.\nA 0.99 carat diamond sits in one slab. Cross into 1 carat — barely any bigger — and the price JUMPS.\nThe diamond hardly changes. The price changes completely.\nWhich is "}],

function buildTable(mod){const m=MODS[mod],rows=m.data();
 let h='<tr>'+m.cols.map(c=>`<th class="${c.t==='num'||c.t==='calc'?'num':''}">${c.l}</th>`).join('')+'<th></th></tr>';
 let b=rows.map((r,i)=>'<tr>'+m.cols.map(c=>{
   if(c.t==='calc')return `<td class="num">${c.comp(r,i)}</td>`;
   const raw=r[c.k];
   if(c.t==='select')return `<td><select onchange="gUpd('${mod}',${i},${c.k},this.value)">${c.o.map(o=>`<option ${o===(raw||c.o[0])?'selected':''}>${o||'—'}</option>`).join('')}</select></td>`;
   const w=c.w?`width:${c.w}`:(c.t==='num'?'width:74px':'min-width:120px');
   return `<td><input class="${c.t==='num'?'num':''}" style="${w}" ${c.ph?`placeholder="${c.ph}"`:''} value="${esc(raw)}" onchange="gUpd('${mod}',${i},${c.k},this.value)"></td>`;
 }).join('')+`<td><button class="icobtn" onclick="gDel('${mod}',${i})">✕</button></td></tr>`).join('');
 return h+b;}
function celebrate(){const n=document.createElement('div');n.className='celebrate';const syms=['◆','✦','◇','✧','❖'],cols=['#7B0017','#c9a04e','#9c2236','#e8a9b3','#15150E'];for(let i=0;i<18;i++){const s=document.createElement('span');s.textContent=syms[i%syms.length];s.style.left=(50+(Math.random()*64-32))+'%';s.style.color=cols[i%cols.length];s.style.fontSize=(10+Math.random()*16)+'px';s.style.animationDelay=(Math.random()*.18)+'s';s.style.setProperty('--dx',(Math.random()*220-110)+'px');n.appendChild(s);}const t=document.createElement('div');t.className='celebrate-toast';t.textContent='✓ Shipped! Drop the proof — reel or screenshot';n.appendChild(t);document.body.appendChild(n);setTimeout(()=>{n.remove();},1700);}
function gUpd(mod,i,k,v){const was=MODS[mod].data()[i][k];MODS[mod].data()[i][k]=v;save();if(mod==='tasks'&&k===3&&v==='Done'&&was!=='Done')celebrate();renderMod(mod);}
function gDel(mod,i){MODS[mod].data().splice(i,1);save();renderMod(mod);}
function gAdd(mod){MODS[mod].data().push(MODS[mod].add());save();renderMod(mod);}
function renderMod(mod){const m=MODS[mod],c=el(m.tbl);if(c)c.innerHTML=buildTable(mod);if(m.after)m.after();}

 const FL=[[0,'Date'],[2,'SPOC'],[3,'Store'],[4,'Vendor'],[5,'Item'],[6,'Qty'],[7,'Rate'],[8,'Purpose'],[9,'Amount']];
 const conflicts=[],onlySheet=[];let matched=0;
 srows.forEach(s=>{const k=spKey(s[1]);
  if(k&&(k in tByPo)){const i=tByPo[k],t=state.spend[i],diffs=[];
   FL.forEach(([col,lab])=>{const tv=String(t[col]==null?'':t[col]).trim(),sv=String(s[col]==null?'':s[col]).trim();
    if(col===6||col===7||col===9){if((+tv||0)!==(+sv||0)&&sv!=='')diffs.push({k:col,lab,t:t[col],s:s[col]});}
    else if(tv!==sv&&sv!=='')diffs.push({k:col,lab,t:t[col],s:s[col]});});
   if(diffs.length)conflicts.push({po:k,i,diffs});else matched++;
  }else{onlySheet.push(s);}});
 const onlyTracker=[];tracker.forEach((r,i)=>{const k=spKey(r[1]);if(k&&!sPo.has(k))onlyTracker.push({i,po:k});});
 return {at:Date.now(),conflicts,onlySheet,onlyTracker,matched,total:srows.length};}

function revStatus(r){const v=(r.items||[]).map(x=>x.verdict);const dec=v.filter(x=>x!=='Pending').length;
 if(r.finalized)return 'Reviewed';if(!v.length||dec===0)return 'In review';
 if(v.some(x=>x==='Revise'||x==='Rejected'))return 'Changes requested';
 if(v.every(x=>x==='Approved'))return 'Approved';return 'In review';}
function revNext(r){const out=[];(r.items||[]).forEach(it=>{if(it.verdict==='Approved')out.push(`<span class="chip c-good">Produce</span> ${esc(it.t)}`);else if(it.verdict==='Revise')out.push(`<span class="chip c-warn">Revise</span> ${esc(it.t)}${it.fb?` — <span class="note">${esc(it.fb)}</span>`:''}`);else if(it.verdict==='Rejected')out.push(`<span class="chip c-bad">Dropped</span> ${esc(it.t)}`);});return out;}

 if(revSel!=null&&findRev(revSel))return revDetail();

function revDetail(){const w=el('revWrap'),r=findRev(revSel);if(!r){revSel=null;return renderReviews();}
 const VO=['Pending','Approved','Revise','Rejected','Hold'],vc={Pending:'c-soft',Approved:'c-good',Revise:'c-warn',Rejected:'c-bad',Hold:'c-info'},bd={Approved:'var(--good)',Revise:'var(--warn)',Rejected:'var(--bad)',Hold:'var(--info)',Pending:'var(--line)'};
 const st=revStatus(r),ns=revNext(r),TY=['Deck','Reels','Mixed'],unit=r.type==='Reels'?'reel':'slide';const ver=r.version||1,ageDays=r.date?Math.max(0,Math.round((Date.now()-new Date(r.date+'T00:00:00').getTime())/864e5)):0,overdue=ageDays>3&&st!=='Approved'&&st!=='Reviewed',bl=r.link||'',bk=revLinkKind(bl);

n(' · ')}</div>`:''}</div><div style="display:flex;gap:6px;align-items:flex-end;flex-direction:column"><span class="chip ${REVC[st]}">${st}</span><button class="btn ghost tiny" onclick="revResubmit('${r.id}')">↻ Resubmit v${ver+1}</button><button class="icobtn" title="Delete this submission" onclick="revDelSub('${r.id}')">🗑</button></div></div></div>`;
 html+=`<div class="sh">${r.type==='Reels'?'Reel-by-reel':'Slide-by-slide'} feedback <small>${esc(r.owner)} sees every line</small></div>`;
 html+=r.items.map((it,ii)=>`<div class="card" style="margin-bottom:12px;border-left:4px solid ${bd[it.verdict]||'var(--line)'}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><input style="font-weight:600;font-size:14.5px;border:0;border-bottom:1px dashed var(--line);border-radius:0;flex:1;min-width:160px;background:transparent" value="${esc(it.t)}" onchange="revItemU('${r.id}',${ii},'t',this.value)"><div style="display:flex;gap:6px;align-items:center"><span class="chip ${vc[it.verdict]}">${it.verdict}</span><select style="width:auto" onchange="revVerdict('${r.id}',${ii},this.value)">${VO.map(o=>`<option ${o===it.verdict?'selected':''}>${o}</option>`).join('')}</select><button class="icobtn" title="Remove ${unit}" onclick="revItemDel('${r.id}',${ii})">✕</button></div></div>${revMedia(it)}<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 8px"><label class="btn ghost tiny" style="cursor:pointer">⬆ Upload ${unit} / reel<input type="file" accept="image/*,application/pdf,video/*" style="display:none" onchange="revUpload('${r.id}',${ii},this)"></label><input style="font-size:11px;flex:1;min-width:150px;padding:7px 9px" value="${(it.media&&it.media.indexOf('data:')!==0)?esc(it.media):((it.img&&it.img.indexOf('data:')!==0)?esc(it.img):'')}" placeholder="…or paste a slide image / reel link" onchange="revLink('${r.id}',${ii},this.value)">${(it.img||it.media)?`<button class="btn ghost tiny" onclick="revClearMedia('${r.id}',${ii})">clear</button>`:''}</div><textarea class="note" rows="2" style="width:100%;margin:2px 0 8px;color:var(--ink);line-height:1.5;border:1px solid var(--line)" placeholder="${esc(r.owner)} adds the brief / what this ${unit} is…" onchange="revItemU('${r.id}',${ii},'idea',this.value)">${esc(it.idea)}</textarea><div class="kv"><label>${esc(r.reviewer)}'s feedback</label><textarea class="editable" rows="2" placeholder="What to change · why approved · what is missing…" onchange="revFb('${r.id}',${ii},this.value)">${esc(it.fb)}</textarea></div>${it.verdict==='Approved'?`<button class="btn ghost tiny" style="margin-top:8px" onclick="revSend('${r.id}',${ii})">${it.sent?'✓ in '+esc(r.owner)+'’s plan':'Send to '+esc(r.owner)+'’s weekly plan →'}</button>`:''}</div>`).join('');
 html+=`<div class="acts"><button class="btn ghost sm" onclick="revItemAdd('${r.id}')">+ add ${unit}</button></div>`;
 html+=`<div class="sh">Next steps for ${esc(r.owner)} <small>auto-generated from verdicts</small></div><div class="card">`+(ns.length?ns.map(s=>`<div class="list-row" style="font-size:13px">${s}</div>`).join(''):'<div class="note">Set verdicts above and the next steps appear here.</div>')+`</div>`;

function revMedia(it){if(it.media){const m=it.media;if(m.slice(0,10)==='data:video')return `<video controls src="${m}" style="width:100%;max-height:380px;border-radius:10px;background:#000;margin:10px 0"></video>`;if(m.slice(0,5)==='data:')return `<a href="${m}" download class="btn ghost sm" style="margin:10px 0;display:inline-block">📄 Open attached file</a>`;const k=revLinkKind(m);return `<a href="${esc(m)}" target="_blank" class="btn ghost sm" style="margin:10px 0;display:inline-block">${k.icon} ${k.label} ↗</a>`;}
 if(it.img)return `<a href="${esc(it.img)}" target="_blank" title="Open full size"><img src="${esc(it.img)}" style="display:block;width:100%;max-height:360px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;margin:10px 0"></a>`;
 return `<div style="border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;margin:10px 0;color:var(--muted2);font-size:12px">No slide or reel attached yet — upload one or paste a link below</div>`;}
function revUpload(id,ii,inp){const f=inp.files&&inp.files[0];if(!f)return;const isVid=/^video\//.test(f.type),cap=isVid?6*1048576:3*1048576;if(f.size>cap){alert('That file is '+(f.size/1048576).toFixed(1)+' MB — too large to embed in the shared app. '+(isVid?'Upload the reel to Drive or Instagram and paste the link instead.':'Use a smaller image, or paste a link.'));inp.value='';return;}const rd=new FileReader();rd.onload=()=>{const r=findRev(id);if(!r)return;if(isVid){r.items[ii].media=rd.result;r.items[ii].img='';}else{r.items[ii].img=rd.result;r.items[ii].media='';}save();revDetail();};rd.readAsDataURL(f);}
function revLink(id,ii,v){const r=findRev(id);if(!r)return;v=(v||'').trim();if(!v){r.items[ii].media='';if(r.items[ii].img&&r.items[ii].img.indexOf('data:')!==0)r.items[ii].img='';}else if(/\.(png|jpe?g|gif|webp)(\?|$)/i.test(v)){r.items[ii].img=v;r.items[ii].media='';}else{r.items[ii].media=v;r.items[ii].img='';}save();revDetail();}

function revVerdict(id,ii,v){const r=findRev(id);if(r){r.items[ii].verdict=v;if(v!=='Approved')r.items[ii].sent=false;save();revDetail();}}
function revFb(id,ii,v){const r=findRev(id);if(r){r.items[ii].fb=v;save();}}
function revItemU(id,ii,f,v){const r=findRev(id);if(r){r.items[ii][f]=v;save();}}

function revItemDel(id,ii){const r=findRev(id);if(r){r.items.splice(ii,1);save();revDetail();}}
function routeReviewer(text){const m=ownerGuess(text||'');if(m)return m;const cmo=TEAM.find(n=>/cmo|coo|chief|head|founder|lead/i.test(ROLES[n]||''));return cmo||(TEAM.indexOf('Ashwanth')>=0?'Ashwanth':(TEAM[0]||'Ashwanth'));}
function revAdd(type){type=type||'Deck';const id='rv_'+Date.now();const isReel=type==='Reels';state.reviews.unshift({id,title:isReel?'New reels review':'New deck review',brief:'',type,owner:state.capFrom||TEAM[0]||'Disha',reviewer:routeReviewer(''),date:new Date().toISOString().slice(0,10),finalized:false,items:[{t:isReel?'Reel 1':'Slide 1',idea:'',verdict:'Pending',fb:'',link:'',img:'',media:''}]});save();openReview(id);}
function revSend(id,ii){const r=findRev(id);if(!r)return;const it=r.items[ii];wkEnsure(r.owner);state.weekly[r.owner].items.push([it.t,'Instagram','—','To do']);it.sent=true;save();revDetail();}
function revLinkKind(u){u=String(u||'');if(!u)return{label:'',icon:''};if(/canva\.com/i.test(u))return{label:'Open in Canva',icon:'🎨'};if(/figma\.com/i.test(u))return{label:'Open in Figma',icon:'✎'};if(/docs\.google|drive\.google/i.test(u))return{label:'Open in Drive',icon:'📄'};if(/instagram\.com/i.test(u))return{label:'Open reel',icon:'▶'};if(/youtube|youtu\.be/i.test(u))return{label:'Open video',icon:'▶'};return{label:'Open brief',icon:'↗'};}
function revResubmit(id){const r=findRev(id);if(!r)return;r.version=(r.version||1)+1;r.date=new Date().toISOString().slice(0,10);r.finalized=false;if(!Array.isArray(r.log))r.log=[];r.log.push({v:r.version,d:r.date});(r.items||[]).forEach(it=>{if(it.verdict==='Revise'||it.verdict==='Rejected'){it.verdict='Pending';it.sent=false;it.produced=false;}});save();revDetail();}
function exportState(){try{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='reia-mos-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href);},100);}catch(e){alert('Export failed: '+e.message);}}
function importState(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!confirm('Import REPLACES all current data with this backup. Continue?')){inp.value='';return;}const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);state=Object.assign(structuredClone(SEED),d);save();syncTeam();buildNav();location.reload();}catch(e){alert('Not a valid backup file.');}};rd.readAsText(f);}
function revFinalize(id){const r=findRev(id);if(!r)return;const today=new Date().toISOString().slice(0,10);let made=0;if(!Array.isArray(state.tasks))state.tasks=[];
 r.items.forEach(it=>{if(it.verdict==='Revise'){state.tasks.push(['Content','Revise: '+it.t+(it.fb?' — '+it.fb:''),r.owner,'To do','','High',r.reviewer,'',today,'']);made++;}else if(it.verdict==='Approved'&&!it.produced){state.tasks.push(['Content','Produce: '+it.t,r.owner,'To do','','High',r.reviewer,'',today,'']);it.produced=true;made++;}});
 r.finalized=true;save();const t=el('t_tasks');if(t)renderMod('tasks');revDetail();alert(made+' task(s) sent to '+r.owner+"'s workspace.");}
const RENDER={capture:renderCapture,command:renderCommand,team:renderTeam,direction:renderDirection,campaigns:renderCampaigns,plan:renderPlan,platforms:renderPlatforms,moms:renderMoM,reviews:renderReviews,ideas:()=>{renderMod('ideas');renderIdeaSum();},contentideas:renderCI,tasks:()=>renderMod('tasks'),outbound:()=>renderMod('outbound'),vendors:()=>renderMod('vendors'),reelcost:()=>renderMod('reelcost'),influencers:()=>renderMod('influencers'),reporting:()=>renderMod('content'),trends:renderTrends,spend:renderSpend,performance:renderPerf,insights:renderInsights,sources:renderSources,guide:renderGuide,archive:renderArchive,tools:renderTools,pillars:renderPillars,pipeline:renderPipeline,calendar:renderCalendar,leads:renderLeads,budget:renderBudget,offers:renderOffers};
function renderAll(){buildViews();Object.keys(RENDER).forEach(k=>{try{RENDER[k]();}catch(e){console.warn(k,e);}});renderCapture();}
async function live(){
 try{const r=await window.cowork.callMcpTool('mcp__Microsoft_Clarity__query-analytics-dashboard',{query:'Number of sessions where the referrer or source is Instagram, last 30 days'});
  const d=r.structuredContent??JSON.parse(r.content[0].text);const rows=d.data||[];const hit=rows.find(x=>/instagram/i.test(x.Metric))||rows.find(x=>/total|session/i.test(x.Metric))||rows[0];
  if(hit){const v=+hit.Value;document._igLive=true;if(!state.metrics.igSess)state.metrics.igSess=isNaN(v)?'':v;computeKPIs();}
 }catch(e){}
 try{const r=await window.cowork.callMcpTool('mcp__0075425c-52b4-4026-9c20-27747e848115__get-shop-info',{});const d=r.structuredContent??JSON.parse(r.content[0].text);if(!REMOTE)setLive('Live: '+(d.name||'Shopify').trim()+' · '+d.currencyCode);}catch(e){if(!REMOTE)setLive('Local mode');}
}
buildNav();
function passOK(){return !APP_PASSWORD||localStorage.getItem('reia_pass')===APP_PASSWORD;}
function showPassGate(){const g=el('passGate');if(!g)return;g.style.display='grid';const i=el('passIn');if(i){i.value='';setTimeout(()=>i.focus(),50);i.onkeydown=e=>{if(e.key==='Enter')passUnlock();};}}
function hidePassGate(){const g=el('passGate');if(g)g.style.display='none';}
function passUnlock(){const m=el('passMsg'),v=(el('passIn')&&el('passIn').value)||'';if(v===APP_PASSWORD){localStorage.setItem('reia_pass',v);hidePassGate();bootApp();}else if(m){m.textContent='Wrong password — try again.';}}
function signOut(){localStorage.removeItem('reia_pass');if(typeof SB!=='undefined'&&SB){try{SB.auth.signOut();}catch(e){}}location.reload();}
let _booted=false;
async function bootApp(){if(_booted)return;_booted=true;try{if(REMOTE)await pullRemote();}catch(e){}renderAll();go('command');live();if(REMOTE)setInterval(async()=>{if(await pullRemote()){renderAll();go(view);}},20000);}
applyTheme();
if(passOK()){hidePassGate();bootApp();}else{showPassGate();}
</script>
